name: Traffic study

on:
  workflow_dispatch:
    inputs:
      queries:
        description: Fixed query pairs per city
        default: '1000'
        required: true
      korea_queries:
        description: Fixed query pairs for the nationwide graph
        default: '200'
        required: true
      repeats:
        description: Timing passes over all eight slots
        default: '3'
        required: true
      region:
        description: One region to run, or all
        default: all
        required: true
      previous_run:
        description: Prior run whose completed region artifacts should be reused
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: traffic-${{ github.ref }}-${{ inputs.region || 'all' }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Select regions
        id: select
        env:
          SELECTED: ${{ inputs.region || 'all' }}
        run: |
          python -c 'import json,os,sys; sys.path.insert(0,"scripts"); from traffic import REGIONS; r=os.environ["SELECTED"]; assert r=="all" or r in REGIONS; print("matrix="+json.dumps({"region":list(REGIONS) if r=="all" else [r]}))' >> "$GITHUB_OUTPUT"

  region:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
      RUSTFLAGS: -C target-cpu=native
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow
      - run: cargo build --release --locked --bin traffic
      - name: Fetch the pinned region with all slot speeds
        run: python scripts/traffic.py fetch "$REGION"
      - name: Certified costs on nine metrics, update and query timing
        env:
          QUERIES: ${{ matrix.region == 'korea' && inputs.korea_queries || inputs.queries }}
          REPEATS: ${{ inputs.repeats }}
        run: python scripts/traffic.py run "$REGION" "results/traffic/$REGION.jsonl" --queries "$QUERIES" --repeats "$REPEATS" --threads "$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-${{ matrix.region }}
          path: results/traffic/${{ matrix.region }}.jsonl
          if-no-files-found: error
          retention-days: 30

  report:
    needs: region
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow
      - uses: actions/download-artifact@v4
        if: ${{ inputs.previous_run != '' }}
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_run }}
          pattern: traffic-*
          path: results/traffic
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: traffic-*
          path: results/traffic
          merge-multiple: true
      - name: Summarize every completed region
        run: |
          python scripts/traffic.py report results/traffic
          sha256sum results/traffic/*.jsonl
          cat results/traffic.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-summary
          path: |
            results/traffic.jsonl
            results/traffic.md
          retention-days: 30
