name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  reports:
    name: Retained reports and page data (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pyarrow osmium
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node --check site/app.js
      - name: Rebuild the results page data from the retained evidence
        run: |
          python3 scripts/page.py
          git diff --exit-code -- site/data.js
      - name: Reconcile and rebuild the retained eleven-city report
        run: |
          python3 scripts/metro.py report results/metro.jsonl --output results/metro.md
          git diff --exit-code -- results/metro.md
