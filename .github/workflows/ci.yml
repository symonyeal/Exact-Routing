name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  reports:
    name: Retained reports and page data (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pyarrow
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node --check site/app.js
      - name: Rebuild the results page data from the retained evidence
        run: |
          python3 scripts/page.py
          git diff --exit-code -- site/data.js
      - name: Rebuild retained traffic and scale reports
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import scale
          import traffic
          for name, module in (('traffic', traffic), ('scale', scale)):
              source = Path(f'results/{name}.jsonl')
              if source.exists():
                  rows = [json.loads(line) for line in source.read_text().splitlines()]
                  Path(f'results/{name}.md').write_text(module.markdown(rows), encoding='utf-8', newline='\n')
          PY
          git diff --exit-code -- results/traffic.md results/scale.md
